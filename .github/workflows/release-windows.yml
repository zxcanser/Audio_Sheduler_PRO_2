name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Check app version
        shell: pwsh
        run: |
          $config = Get-Content config.py -Raw
          if ($config -notmatch 'APP_VERSION\s*=\s*"${{ steps.version.outputs.version }}"') {
            Write-Error "APP_VERSION in config.py must be ${{ steps.version.outputs.version }} for tag ${{ github.ref_name }}"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build app with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name AudioSchedulerPRO `
            --icon ASP_icon.ico `
            --add-data "audio;audio" `
            --add-data "ASP_icon.ico;." `
            --hidden-import pystray `
            --hidden-import pystray._win32 `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer\AudioSchedulerPRO.iss

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AudioSchedulerPRO v${{ steps.version.outputs.version }}"
          files: dist/AudioSchedulerPRO_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
